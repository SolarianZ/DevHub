[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devhub-sdk"
version = "0.1.0"
description = "DevHub 协议 Python SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DevHub Contributors" }]
dependencies = [
  "websockets>=15,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devhub_sdk = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
