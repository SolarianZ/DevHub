name: monitor

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/monitor/**"
      - "sdks/javascript/**"
      - "scripts/release/package_monitor.py"
      - ".github/workflows/monitor.yml"
  pull_request:
    paths:
      - "apps/monitor/**"
      - "sdks/javascript/**"
      - "scripts/release/package_monitor.py"
      - ".github/workflows/monitor.yml"

jobs:
  monitor-validation:
    runs-on: ubuntu-latest

    env:
      DEVHUB_MONITOR_SDK_SOURCE: local-src

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Monitor dependencies
        run: npm --prefix apps/monitor ci

      - name: Build Monitor frontend
        run: npm --prefix apps/monitor run build:web

      - name: Run Monitor frontend tests
        run: npm --prefix apps/monitor test

      - name: Run Monitor native tests
        run: npm --prefix apps/monitor run test:native

      - name: Run Monitor native checks
        run: npm --prefix apps/monitor run tauri:check

      - name: Run Monitor packaging validation
        run: python3 scripts/release/package_monitor.py --release-id monitor-ci --sdk-source local-src

      - name: Upload Monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: monitor-diagnostics-${{ github.run_id }}
          path: |
            artifacts/monitor/**
            apps/monitor/src-tauri/target/release/bundle/**
          if-no-files-found: warn
