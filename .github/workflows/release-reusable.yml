name: release-reusable

on:
  workflow_call:
    inputs:
      target_ref:
        description: Git ref or commit SHA to package and publish.
        required: true
        type: string
      release_ref:
        description: Branch or tag ref that determines the release channel.
        required: true
        type: string
      verify_ci_success:
        description: Whether to require an existing successful ci push run for the target commit.
        required: false
        default: false
        type: boolean

jobs:
  resolve_release_metadata:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_publish: ${{ steps.gate.outputs.should_publish }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
          VERIFY_CI_SUCCESS: ${{ inputs.verify_ci_success }}
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha::7}"
          commit_stamp="$(git show -s --date=format:%Y%m%dT%H%M%SZ --format=%cd "$commit_sha")"
          channel=""
          release_tag=""
          release_id=""
          release_name=""
          prerelease="true"

          case "${RELEASE_REF}" in
            preview|refs/heads/preview)
              channel="preview"
              release_tag="preview-latest"
              release_id="preview-latest"
              release_name="DevHub Preview"
              prerelease="true"
              ;;
            main|refs/heads/main)
              channel="main-snapshot"
              release_tag="main-${commit_stamp}-${short_sha}"
              release_id="${release_tag}"
              release_name="DevHub Main Snapshot ${commit_stamp} ${short_sha}"
              prerelease="true"
              ;;
            v*)
              channel="stable"
              release_tag="${RELEASE_REF}"
              release_id="${release_tag}"
              release_name="DevHub ${release_tag}"
              prerelease="false"
              ;;
            refs/tags/v*)
              channel="stable"
              release_tag="${RELEASE_REF#refs/tags/}"
              release_id="${release_tag}"
              release_name="DevHub ${release_tag}"
              prerelease="false"
              ;;
            *)
              mapfile -t version_tags < <(git tag --points-at "${commit_sha}" --list 'v*' | sort)
              if [[ ${#version_tags[@]} -eq 1 ]]; then
                channel="stable"
                release_tag="${version_tags[0]}"
                release_id="${release_tag}"
                release_name="DevHub ${release_tag}"
                prerelease="false"
              else
                echo "release_ref must resolve to preview, main, or a unique v* tag." >&2
                exit 1
              fi
              ;;
          esac

          if [[ "${VERIFY_CI_SUCCESS}" == "true" ]]; then
            ci_runs_json="$(
              gh api "/repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f event=push \
                -f status=completed \
                -f per_page=100 \
                -f head_sha="${commit_sha}"
            )"

            has_successful_ci="$(
              printf '%s' "${ci_runs_json}" | python3 -c "import json, sys; data = json.load(sys.stdin); print('true' if any(run.get('conclusion') == 'success' for run in data.get('workflow_runs', [])) else 'false')"
            )"

            if [[ "${has_successful_ci}" != "true" ]]; then
              echo "target commit has no successful ci push run: ${commit_sha}" >&2
              exit 1
            fi
          fi

          {
            echo "commit_sha=${commit_sha}"
            echo "channel=${channel}"
            echo "release_tag=${release_tag}"
            echo "release_id=${release_id}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Decide publish eligibility
        id: gate
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          should_publish="true"

          if [[ "${CHANNEL}" == "preview" ]]; then
            remote_sha="$(git ls-remote origin refs/heads/preview | awk 'NR==1 { print $1 }')"

            if [[ -z "${remote_sha}" ]]; then
              echo "Failed to resolve remote preview head." >&2
              exit 1
            fi

            if [[ "${remote_sha}" != "${COMMIT_SHA}" ]]; then
              should_publish="false"
              echo "Preview branch advanced to ${remote_sha}; skip stale publish for ${COMMIT_SHA}."
            fi
          fi

          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"

  package_core_assets:
    needs: resolve_release_metadata
    if: needs.resolve_release_metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Package Host and SDK release assets
        run: |
          python scripts/release/package_release.py \
            --release-id "${{ needs.resolve_release_metadata.outputs.release_id }}" \
            --channel "${{ needs.resolve_release_metadata.outputs.channel }}" \
            --release-tag "${{ needs.resolve_release_metadata.outputs.release_tag }}" \
            --release-name "${{ needs.resolve_release_metadata.outputs.release_name }}" \
            --commit "${{ needs.resolve_release_metadata.outputs.commit_sha }}" \
            --skip-monitor

      - name: Upload core release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-core-${{ needs.resolve_release_metadata.outputs.release_id }}
          path: artifacts/release/${{ needs.resolve_release_metadata.outputs.release_id }}
          if-no-files-found: error

      - name: Upload core release diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-core-diagnostics-${{ github.run_id }}
          path: artifacts/release/**
          if-no-files-found: warn

  package_monitor_assets:
    needs: resolve_release_metadata
    if: >
      needs.resolve_release_metadata.outputs.should_publish == 'true' &&
      (needs.resolve_release_metadata.outputs.channel == 'preview' ||
       needs.resolve_release_metadata.outputs.channel == 'main-snapshot')
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Package Monitor App assets
        run: python scripts/release/package_monitor.py --release-id "${{ needs.resolve_release_metadata.outputs.release_id }}" --output-root artifacts/monitor

      - name: Upload Monitor App assets
        uses: actions/upload-artifact@v6
        with:
          name: monitor-assets-${{ matrix.runner }}
          path: artifacts/monitor/${{ needs.resolve_release_metadata.outputs.release_id }}
          if-no-files-found: error

      - name: Upload Monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: monitor-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            artifacts/monitor/**
            apps/monitor/src-tauri/target/release/bundle/**
          if-no-files-found: warn

  publish_github_release:
    needs:
      - resolve_release_metadata
      - package_core_assets
      - package_monitor_assets
    if: >
      always() &&
      needs.resolve_release_metadata.outputs.should_publish == 'true' &&
      needs.package_core_assets.result == 'success' &&
      (needs.resolve_release_metadata.outputs.channel == 'stable' ||
       needs.package_monitor_assets.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download core release assets
        uses: actions/download-artifact@v7
        with:
          name: release-core-${{ needs.resolve_release_metadata.outputs.release_id }}
          path: artifacts/release/${{ needs.resolve_release_metadata.outputs.release_id }}

      - name: Download Monitor App assets
        if: needs.resolve_release_metadata.outputs.channel != 'stable'
        uses: actions/download-artifact@v7
        with:
          pattern: monitor-assets-*
          path: ${{ runner.temp }}/monitor-assets
          merge-multiple: false

      - name: Refresh release manifest with Monitor assets
        if: needs.resolve_release_metadata.outputs.channel != 'stable'
        run: |
          python scripts/release/package_release.py \
            --release-id "${{ needs.resolve_release_metadata.outputs.release_id }}" \
            --channel "${{ needs.resolve_release_metadata.outputs.channel }}" \
            --release-tag "${{ needs.resolve_release_metadata.outputs.release_tag }}" \
            --release-name "${{ needs.resolve_release_metadata.outputs.release_name }}" \
            --commit "${{ needs.resolve_release_metadata.outputs.commit_sha }}" \
            --reuse-existing-output \
            --skip-monitor \
            --monitor-assets-root "${{ runner.temp }}/monitor-assets"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="artifacts/release/${{ needs.resolve_release_metadata.outputs.release_id }}"
          release_tag="${{ needs.resolve_release_metadata.outputs.release_tag }}"
          release_name="${{ needs.resolve_release_metadata.outputs.release_name }}"
          channel="${{ needs.resolve_release_metadata.outputs.channel }}"

          release_files=(
            "$release_dir"/host/*.zip
            "$release_dir"/sdk/dotnet/*
            "$release_dir"/sdk/javascript/*.tgz
            "$release_dir"/sdk/python/*
            "$release_dir"/release-manifest.json
            "$release_dir"/release-notes.md
          )

          if [[ -d "$release_dir/monitor" ]]; then
            while IFS= read -r -d '' file; do
              release_files+=("$file")
            done < <(find "$release_dir/monitor" -type f -path "*/bundle/*" -print0 | sort -z)
          fi

          if [[ "${channel}" == "preview" ]]; then
            gh release delete "${release_tag}" --yes --cleanup-tag || true
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_name}" \
              --notes-file "$release_dir/release-notes.md" \
              --prerelease \
              --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
          elif [[ "${channel}" == "main-snapshot" ]]; then
            gh release delete "${release_tag}" --yes --cleanup-tag || true
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_name}" \
              --notes-file "$release_dir/release-notes.md" \
              --prerelease \
              --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
          else
            if gh release view "${release_tag}" >/dev/null 2>&1; then
              gh release upload "${release_tag}" "${release_files[@]}" --clobber
              gh release edit "${release_tag}" \
                --title "${release_name}" \
                --notes-file "$release_dir/release-notes.md"
            else
              gh release create "${release_tag}" "${release_files[@]}" \
                --title "${release_name}" \
                --notes-file "$release_dir/release-notes.md" \
                --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
            fi
          fi

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: artifacts/release/**
          if-no-files-found: warn
