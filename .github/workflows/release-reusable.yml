name: release-reusable

on:
  workflow_call:
    inputs:
      target_ref:
        description: Git ref or commit SHA to publish.
        required: true
        type: string
      release_ref:
        description: Branch or tag ref that determines the release channel.
        required: true
        type: string
      verify_ci_success:
        description: Whether to require an existing successful ci push run for the target commit.
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: Existing ci run id that already prepared the verified release assets.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_ref }}
  cancel-in-progress: ${{ !(startsWith(inputs.release_ref, 'refs/tags/v') || startsWith(inputs.release_ref, 'v')) }}

jobs:
  resolve_release_metadata:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
      ci_run_id: ${{ steps.meta.outputs.ci_run_id }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
          VERIFY_CI_SUCCESS: ${{ inputs.verify_ci_success }}
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          metadata_json="$(python3 scripts/release/resolve_release_metadata.py --release-ref "${RELEASE_REF}" --commit "${commit_sha}")"
          channel="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['channel'])")"
          release_tag="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseTag'])")"
          release_id="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseId'])")"
          release_name="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseName'])")"
          prerelease="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print('true' if json.load(sys.stdin)['prerelease'] else 'false')")"
          ci_run_id="${INPUT_CI_RUN_ID}"

          if [[ "${VERIFY_CI_SUCCESS}" == "true" ]]; then
            ci_runs_json="$(
              gh api "/repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f event=push \
                -f status=completed \
                -f per_page=100 \
                -f head_sha="${commit_sha}"
            )"

            ci_run_id="$(
              CI_RUNS_JSON="${ci_runs_json}" python3 -c 'import json, os, sys; release_ref = sys.argv[1]; ref_name = release_ref.removeprefix("refs/heads/").removeprefix("refs/tags/"); scored_runs = [((2 if run.get("head_branch") == ref_name else 1 if release_ref.startswith("refs/tags/") and not run.get("head_branch") else 0), run.get("run_number") or 0, str(run.get("id", ""))) for run in json.loads(os.environ["CI_RUNS_JSON"]).get("workflow_runs", []) if run.get("conclusion") == "success"]; scored_runs.sort(reverse=True); print(scored_runs[0][2] if scored_runs else "")' "${RELEASE_REF}"
            )"

            if [[ -z "${ci_run_id}" ]]; then
              echo "target commit has no matching successful ci push run: ${commit_sha}" >&2
              exit 1
            fi
          elif [[ -z "${ci_run_id}" ]]; then
            echo "ci_run_id is required when verify_ci_success is false." >&2
            exit 1
          fi

          {
            echo "commit_sha=${commit_sha}"
            echo "channel=${channel}"
            echo "release_tag=${release_tag}"
            echo "release_id=${release_id}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
            echo "ci_run_id=${ci_run_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Decide publish eligibility
        id: gate
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          should_publish="true"

          if [[ "${CHANNEL}" == "preview" ]]; then
            remote_sha="$(git ls-remote origin refs/heads/preview | awk 'NR==1 { print $1 }')"

            if [[ -z "${remote_sha}" ]]; then
              echo "Failed to resolve remote preview head." >&2
              exit 1
            fi

            if [[ "${remote_sha}" != "${COMMIT_SHA}" ]]; then
              should_publish="false"
              echo "Preview branch advanced to ${remote_sha}; skip stale publish for ${COMMIT_SHA}."
            fi
          fi

          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"

  publish_github_release:
    needs: resolve_release_metadata
    if: needs.resolve_release_metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download core release assets from ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="artifacts/release/${{ needs.resolve_release_metadata.outputs.release_id }}"
          download_root="${RUNNER_TEMP}/release-core-download"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          rm -rf "${download_root}"
          mkdir -p "${download_root}"

          gh run download "${{ needs.resolve_release_metadata.outputs.ci_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "release-core-${{ needs.resolve_release_metadata.outputs.release_id }}" \
            --dir "${download_root}"

          artifact_dir="${download_root}/release-core-${{ needs.resolve_release_metadata.outputs.release_id }}"
          if [[ ! -d "${artifact_dir}" ]]; then
            artifact_dir="${download_root}"
          fi

          shopt -s dotglob
          mv "${artifact_dir}"/* "${release_dir}/"
          shopt -u dotglob

      - name: Download Monitor App assets from ci
        if: needs.resolve_release_metadata.outputs.channel != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          monitor_root="${RUNNER_TEMP}/monitor-assets"
          rm -rf "${monitor_root}"
          mkdir -p "${monitor_root}"

          for artifact_name in \
            "monitor-assets-ubuntu-latest-${{ needs.resolve_release_metadata.outputs.release_id }}" \
            "monitor-assets-windows-latest-${{ needs.resolve_release_metadata.outputs.release_id }}" \
            "monitor-assets-macos-latest-${{ needs.resolve_release_metadata.outputs.release_id }}"
          do
            download_dir="${monitor_root}/.downloads/${artifact_name}"
            artifact_dir="${monitor_root}/${artifact_name}"
            rm -rf "${download_dir}" "${artifact_dir}"
            mkdir -p "${download_dir}" "${artifact_dir}"
            gh run download "${{ needs.resolve_release_metadata.outputs.ci_run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${artifact_name}" \
              --dir "${download_dir}"

            extracted_dir="${download_dir}/${artifact_name}"
            if [[ ! -d "${extracted_dir}" ]]; then
              extracted_dir="${download_dir}"
            fi

            shopt -s dotglob
            mv "${extracted_dir}"/* "${artifact_dir}/"
            shopt -u dotglob
          done

      - name: Refresh release manifest with Monitor assets
        if: needs.resolve_release_metadata.outputs.channel != 'stable'
        run: |
          python3 scripts/release/package_release.py \
            --release-id "${{ needs.resolve_release_metadata.outputs.release_id }}" \
            --channel "${{ needs.resolve_release_metadata.outputs.channel }}" \
            --release-tag "${{ needs.resolve_release_metadata.outputs.release_tag }}" \
            --release-name "${{ needs.resolve_release_metadata.outputs.release_name }}" \
            --commit "${{ needs.resolve_release_metadata.outputs.commit_sha }}" \
            --reuse-existing-output \
            --skip-monitor \
            --monitor-assets-root "${{ runner.temp }}/monitor-assets"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="artifacts/release/${{ needs.resolve_release_metadata.outputs.release_id }}"
          release_tag="${{ needs.resolve_release_metadata.outputs.release_tag }}"
          release_name="${{ needs.resolve_release_metadata.outputs.release_name }}"
          channel="${{ needs.resolve_release_metadata.outputs.channel }}"

          release_files=(
            "$release_dir"/host/*.zip
            "$release_dir"/sdk/dotnet/*
            "$release_dir"/sdk/javascript/*.tgz
            "$release_dir"/sdk/python/*
            "$release_dir"/release-manifest.json
            "$release_dir"/release-notes.md
          )

          if [[ -d "$release_dir/monitor" ]]; then
            while IFS= read -r -d '' file; do
              release_files+=("$file")
            done < <(find "$release_dir/monitor" -type f -path "*/bundle/*" -print0 | sort -z)
          fi

          if [[ "${channel}" == "preview" ]]; then
            gh release delete "${release_tag}" --yes --cleanup-tag || true
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_name}" \
              --notes-file "$release_dir/release-notes.md" \
              --prerelease \
              --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
          elif [[ "${channel}" == "main-snapshot" ]]; then
            gh release delete "${release_tag}" --yes --cleanup-tag || true
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_name}" \
              --notes-file "$release_dir/release-notes.md" \
              --prerelease \
              --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
          else
            if gh release view "${release_tag}" >/dev/null 2>&1; then
              gh release upload "${release_tag}" "${release_files[@]}" --clobber
              gh release edit "${release_tag}" \
                --title "${release_name}" \
                --notes-file "$release_dir/release-notes.md"
            else
              gh release create "${release_tag}" "${release_files[@]}" \
                --title "${release_name}" \
                --notes-file "$release_dir/release-notes.md" \
                --target "${{ needs.resolve_release_metadata.outputs.commit_sha }}"
            fi
          fi

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: artifacts/release/**
          if-no-files-found: warn
