name: release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Release target (`preview`, `main`, or a `v*` tag)
        type: string
        required: true

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Resolve release target
        id: resolve
        env:
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "${INPUT_TARGET_REF}" in
            preview|refs/heads/preview)
              target_ref="refs/heads/preview"
              release_ref="refs/heads/preview"
              ;;
            main|refs/heads/main)
              target_ref="refs/heads/main"
              release_ref="refs/heads/main"
              ;;
            v*)
              target_ref="refs/tags/${INPUT_TARGET_REF}"
              release_ref="${target_ref}"
              ;;
            refs/tags/v*)
              target_ref="${INPUT_TARGET_REF}"
              release_ref="${INPUT_TARGET_REF}"
              ;;
            *)
              echo "workflow_dispatch target_ref must be preview, main, or a v* tag." >&2
              exit 1
              ;;
          esac

          {
            echo "target_ref=${target_ref}"
            echo "release_ref=${release_ref}"
          } >> "${GITHUB_OUTPUT}"

  package-and-publish:
    needs: resolve-target
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-reusable.yml
    with:
      target_ref: ${{ needs.resolve-target.outputs.target_ref }}
      release_ref: ${{ needs.resolve-target.outputs.release_ref }}
      verify_ci_success: true
    secrets: inherit
