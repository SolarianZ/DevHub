name: release-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Host
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/DevHub.Host/DevHub.Host.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained false \
            -p:PublishSingleFile=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devhub-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
