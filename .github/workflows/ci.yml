name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "eng/**"
      - "host/**"
      - "apps/**"
      - "scripts/**"
      - "sdks/**"
      - ".github/workflows/**"
      - "docs/specification/**"
  pull_request:
    paths:
      - "eng/**"
      - "host/**"
      - "apps/**"
      - "scripts/**"
      - "sdks/**"
      - ".github/workflows/**"
      - "docs/specification/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      changed_scopes: ${{ steps.plan.outputs.changed_scopes }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      release_id: ${{ steps.plan.outputs.release_id }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      is_release_intent: ${{ steps.plan.outputs.is_release_intent }}
      run_primary_validation: ${{ steps.plan.outputs.run_primary_validation }}
      run_sdk_dotnet: ${{ steps.plan.outputs.run_sdk_dotnet }}
      run_sdk_js: ${{ steps.plan.outputs.run_sdk_js }}
      run_sdk_python: ${{ steps.plan.outputs.run_sdk_python }}
      run_sdk_conformance: ${{ steps.plan.outputs.run_sdk_conformance }}
      run_monitor_validation: ${{ steps.plan.outputs.run_monitor_validation }}
      run_integration_full_gate: ${{ steps.plan.outputs.run_integration_full_gate }}
      run_cross_platform_smoke: ${{ steps.plan.outputs.run_cross_platform_smoke }}
      prepare_release_core_assets: ${{ steps.plan.outputs.prepare_release_core_assets }}
      prepare_monitor_release_assets: ${{ steps.plan.outputs.prepare_monitor_release_assets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve routing and change scopes
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          release_channel="none"
          case "${REF}" in
            refs/heads/preview)
              release_channel="preview"
              ;;
            refs/heads/main)
              release_channel="main-snapshot"
              ;;
            refs/tags/v*)
              release_channel="stable"
              ;;
          esac

          is_release_intent="false"
          if [[ "${EVENT_NAME}" == "push" && "${release_channel}" != "none" ]]; then
            is_release_intent="true"
          fi

          base_sha=""
          head_sha="${SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ -n "${EVENT_BEFORE}" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${EVENT_BEFORE}"
          fi

          if [[ -n "${base_sha}" ]]; then
            git diff --name-only "${base_sha}" "${head_sha}" > "${RUNNER_TEMP}/devhub-changed-files.txt"
          else
            git show --pretty="" --name-only "${head_sha}" > "${RUNNER_TEMP}/devhub-changed-files.txt"
          fi

          changed_host="false"
          changed_sdk_dotnet="false"
          changed_sdk_js="false"
          changed_sdk_python="false"
          changed_monitor="false"
          changed_release="false"
          changed_workflow="false"
          changed_docs_specification="false"

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              eng/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_monitor="true"
                changed_release="true"
                ;;
              host/*)
                changed_host="true"
                ;;
              sdks/dotnet/*)
                changed_sdk_dotnet="true"
                ;;
              sdks/javascript/*)
                changed_sdk_js="true"
                changed_monitor="true"
                ;;
              sdks/python/*)
                changed_sdk_python="true"
                ;;
              apps/monitor/*)
                changed_monitor="true"
                ;;
              apps/*)
                changed_monitor="true"
                ;;
              scripts/release/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_monitor="true"
                changed_release="true"
                ;;
              scripts/sdk/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                ;;
              scripts/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_monitor="true"
                changed_release="true"
                ;;
              .github/workflows/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_monitor="true"
                changed_release="true"
                changed_workflow="true"
                ;;
              docs/specification/*)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_docs_specification="true"
                ;;
              *)
                changed_host="true"
                changed_sdk_dotnet="true"
                changed_sdk_js="true"
                changed_sdk_python="true"
                changed_monitor="true"
                changed_release="true"
                changed_workflow="true"
                ;;
            esac
          done < "${RUNNER_TEMP}/devhub-changed-files.txt"

          if [[ "${is_release_intent}" == "true" ]]; then
            run_primary_validation="true"
            run_sdk_dotnet="true"
            run_sdk_js="true"
            run_sdk_python="true"
            run_sdk_conformance="true"
            run_integration_full_gate="true"
            run_cross_platform_smoke="true"
            prepare_release_core_assets="true"
            if [[ "${release_channel}" == "stable" ]]; then
              run_monitor_validation="false"
              prepare_monitor_release_assets="false"
            else
              run_monitor_validation="true"
              prepare_monitor_release_assets="true"
            fi
          else
            run_primary_validation="false"
            run_sdk_dotnet="false"
            run_sdk_js="false"
            run_sdk_python="false"
            run_sdk_conformance="false"
            run_monitor_validation="false"
            run_integration_full_gate="false"
            run_cross_platform_smoke="false"
            prepare_release_core_assets="false"
            prepare_monitor_release_assets="false"

            if [[ "${changed_host}" == "true" || "${changed_sdk_dotnet}" == "true" || "${changed_sdk_js}" == "true" || "${changed_sdk_python}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" || "${changed_docs_specification}" == "true" ]]; then
              run_primary_validation="true"
            fi
            if [[ "${changed_host}" == "true" || "${changed_sdk_dotnet}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" || "${changed_docs_specification}" == "true" ]]; then
              run_sdk_dotnet="true"
            fi
            if [[ "${changed_host}" == "true" || "${changed_sdk_js}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" || "${changed_docs_specification}" == "true" ]]; then
              run_sdk_js="true"
            fi
            if [[ "${changed_host}" == "true" || "${changed_sdk_python}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" || "${changed_docs_specification}" == "true" ]]; then
              run_sdk_python="true"
            fi
            if [[ "${changed_host}" == "true" || "${changed_sdk_dotnet}" == "true" || "${changed_sdk_js}" == "true" || "${changed_sdk_python}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" || "${changed_docs_specification}" == "true" ]]; then
              run_sdk_conformance="true"
            fi
            if [[ "${changed_monitor}" == "true" || "${changed_sdk_js}" == "true" || "${changed_release}" == "true" || "${changed_workflow}" == "true" ]]; then
              run_monitor_validation="true"
            fi
          fi

          changed_scopes=()
          if [[ "${changed_host}" == "true" ]]; then changed_scopes+=("host"); fi
          if [[ "${changed_sdk_dotnet}" == "true" ]]; then changed_scopes+=("sdk-dotnet"); fi
          if [[ "${changed_sdk_js}" == "true" ]]; then changed_scopes+=("sdk-js"); fi
          if [[ "${changed_sdk_python}" == "true" ]]; then changed_scopes+=("sdk-python"); fi
          if [[ "${changed_monitor}" == "true" ]]; then changed_scopes+=("monitor"); fi
          if [[ "${changed_release}" == "true" ]]; then changed_scopes+=("release"); fi
          if [[ "${changed_workflow}" == "true" ]]; then changed_scopes+=("workflow"); fi
          if [[ "${changed_docs_specification}" == "true" ]]; then changed_scopes+=("docs-specification"); fi

          changed_scopes_value="none"
          if [[ "${#changed_scopes[@]}" -gt 0 ]]; then
            changed_scopes_value="$(IFS=,; echo "${changed_scopes[*]}")"
          fi

          release_id=""
          release_tag=""
          release_name=""
          if [[ "${is_release_intent}" == "true" ]]; then
            metadata_json="$(python3 scripts/release/resolve_release_metadata.py --release-ref "${REF}" --commit "${head_sha}")"
            release_id="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseId'])")"
            release_tag="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseTag'])")"
            release_name="$(printf '%s' "${metadata_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['releaseName'])")"
          fi

          {
            echo "changed_scopes=${changed_scopes_value}"
            echo "release_channel=${release_channel}"
            echo "release_id=${release_id}"
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
            echo "is_release_intent=${is_release_intent}"
            echo "run_primary_validation=${run_primary_validation}"
            echo "run_sdk_dotnet=${run_sdk_dotnet}"
            echo "run_sdk_js=${run_sdk_js}"
            echo "run_sdk_python=${run_sdk_python}"
            echo "run_sdk_conformance=${run_sdk_conformance}"
            echo "run_monitor_validation=${run_monitor_validation}"
            echo "run_integration_full_gate=${run_integration_full_gate}"
            echo "run_cross_platform_smoke=${run_cross_platform_smoke}"
            echo "prepare_release_core_assets=${prepare_release_core_assets}"
            echo "prepare_monitor_release_assets=${prepare_monitor_release_assets}"
          } >> "${GITHUB_OUTPUT}"

  build-and-test:
    needs: route
    if: needs.route.outputs.run_primary_validation == 'true'
    runs-on: ubuntu-latest

    env:
      DEVHUB_DATA_DIR: /tmp/devhub-ci-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify version metadata
        run: python3 scripts/release/sync_versions.py --check

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Restore
        run: dotnet restore host/DevHub.slnx

      - name: Build
        run: dotnet build host/DevHub.slnx -c Release --no-restore

      - name: Clean test result artifacts
        run: find host -type d -name TestResults -prune -exec rm -rf {} +

      - name: Unit tests with coverage
        run: dotnet test host/DevHub.slnx -c Release --no-build --collect:"XPlat Code Coverage" --settings host/tests/tools/coverage.runsettings --logger "trx;LogFileName=unit-tests.trx" --verbosity normal

      - name: Verify coverage thresholds (line>=80%, branch>=80%)
        shell: bash
        run: |
          set -euo pipefail
          python3 host/tests/tools/verify_coverage.py --root . --line-threshold 0.80 --branch-threshold 0.80 2>&1 | tee "$RUNNER_TEMP/devhub-ci-coverage.log"

      - name: Integration tests (fast)
        shell: bash
        run: |
          set -Eeuo pipefail

          runner_log="$RUNNER_TEMP/devhub-ci-fast-tests.log"
          host_log="$RUNNER_TEMP/devhub-ci-host.log"
          repo_temp_dir="$GITHUB_WORKSPACE/temp"
          text_report_path="$repo_temp_dir/test_results.txt"
          test_log_path="$repo_temp_dir/test_log.txt"
          runtime_dir="$DEVHUB_DATA_DIR/runtime"
          definitions_dir="$DEVHUB_DATA_DIR/apps/definitions"

          print_file_if_exists() {
            local label="$1"
            local path="$2"
            if [ -f "$path" ]; then
              echo "--- $label ($path) ---"
              cat "$path"
            fi
          }

          print_file_tail_if_exists() {
            local label="$1"
            local path="$2"
            local lines="${3:-200}"
            if [ -f "$path" ]; then
              echo "--- $label (last $lines lines: $path) ---"
              tail -n "$lines" "$path"
            fi
          }

          dump_diagnostics() {
            local status="${1:-1}"
            echo "::group::DevHub fast integration diagnostics"
            echo "Exit code: $status"
            echo "Data dir: $DEVHUB_DATA_DIR"
            echo "Runtime dir: $runtime_dir"
            echo "App definitions dir: $definitions_dir"

            if [ -d "$DEVHUB_DATA_DIR" ]; then
              echo "--- data dir tree ---"
              find "$DEVHUB_DATA_DIR" -maxdepth 3 -mindepth 1 -print | sort
            fi

            print_file_if_exists "hub.json" "$runtime_dir/hub.json"
            print_file_tail_if_exists "test runner log" "$runner_log"
            print_file_if_exists "test text report" "$text_report_path"
            print_file_tail_if_exists "test framework log" "$test_log_path"
            print_file_tail_if_exists "host log" "$host_log"
            echo "::endgroup::"
          }

          on_error() {
            local status="$?"
            trap - ERR
            set +e
            dump_diagnostics "$status"
            exit "$status"
          }

          trap on_error ERR

          rm -rf "$DEVHUB_DATA_DIR"
          mkdir -p "$definitions_dir"
          rm -rf "$repo_temp_dir"
          mkdir -p "$repo_temp_dir"

          dotnet run --project host/src/DevHub.Host/DevHub.Host.csproj -c Release --no-build --no-launch-profile >"$host_log" 2>&1 &
          HOST_PID=$!

          cleanup() {
            kill "$HOST_PID" >/dev/null 2>&1 || true
            wait "$HOST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if [ -f "$runtime_dir/hub.json" ]; then
              break
            fi
            sleep 1
          done

          if [ ! -f "$runtime_dir/hub.json" ]; then
            echo "hub.json not generated by host"
            false
          fi

          python3 host/tests/blackbox/test_runner.py --fast --no-header --use-existing-host --no-build-host 2>&1 | tee "$runner_log"

      - name: Upload shared Host artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-host-release
          path: host/src/DevHub.Host/bin/Release/net10.0
          if-no-files-found: error

      - name: Upload build-and-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-test-diagnostics
          path: |
            ${{ runner.temp }}/devhub-ci-coverage.log
            ${{ runner.temp }}/devhub-ci-fast-tests.log
            ${{ runner.temp }}/devhub-ci-host.log
            temp/test_results.txt
            temp/test_results.json
            temp/test_log.txt
            host/**/TestResults/**
          if-no-files-found: warn

  sdk-dotnet-tests:
    needs:
      - route
      - build-and-test
    if: needs.route.outputs.run_sdk_dotnet == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download shared Host artifact
        uses: actions/download-artifact@v5
        with:
          name: sdk-host-release
          path: ${{ runner.temp }}/sdk-host-release

      - name: Run .NET SDK tests
        env:
          DEVHUB_SDK_HOST_ASSEMBLY: ${{ runner.temp }}/sdk-host-release/DevHub.Host.dll
        run: |
          dotnet build sdks/dotnet/DevHub.DotNetSdk.slnx -c Release
          dotnet test sdks/dotnet/DevHub.DotNetSdk.slnx -c Release --no-build

      - name: Verify .NET SDK Release outputs
        shell: bash
        run: |
          test -f host/src/DevHub.Core/bin/Release/net10.0/DevHub.Core.dll
          test -f host/src/DevHub.Host/bin/Release/net10.0/DevHub.Host.dll

      - name: Build .NET SDK in Debug
        run: dotnet build sdks/dotnet/DevHub.DotNetSdk.slnx -c Debug --no-restore

      - name: Verify .NET SDK Debug outputs
        shell: bash
        run: |
          test -f host/src/DevHub.Core/bin/Debug/net10.0/DevHub.Core.dll
          test -f host/src/DevHub.Host/bin/Debug/net10.0/DevHub.Host.dll

  sdk-ts-tests:
    needs:
      - route
      - build-and-test
    if: needs.route.outputs.run_sdk_js == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json

      - name: Install JavaScript SDK dependencies
        run: npm --prefix sdks/javascript ci

      - name: Build JavaScript SDK
        run: npm --prefix sdks/javascript run build

      - name: Download shared Host artifact
        uses: actions/download-artifact@v5
        with:
          name: sdk-host-release
          path: ${{ runner.temp }}/sdk-host-release

      - name: Run JavaScript SDK tests
        env:
          DEVHUB_SDK_HOST_ASSEMBLY: ${{ runner.temp }}/sdk-host-release/DevHub.Host.dll
        run: npm --prefix sdks/javascript test

  sdk-python-tests:
    needs:
      - route
      - build-and-test
    if: needs.route.outputs.run_sdk_python == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdks/python[test]' requests

      - name: Download shared Host artifact
        uses: actions/download-artifact@v5
        with:
          name: sdk-host-release
          path: ${{ runner.temp }}/sdk-host-release

      - name: Run Python SDK tests
        env:
          DEVHUB_SDK_HOST_ASSEMBLY: ${{ runner.temp }}/sdk-host-release/DevHub.Host.dll
        run: python -m pytest sdks/python/tests

  sdk-conformance:
    needs:
      - route
      - build-and-test
    if: needs.route.outputs.run_sdk_conformance == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdks/python[test]' requests

      - name: Install JavaScript SDK dependencies
        run: npm --prefix sdks/javascript ci

      - name: Build JavaScript SDK
        run: npm --prefix sdks/javascript run build

      - name: Download shared Host artifact
        uses: actions/download-artifact@v5
        with:
          name: sdk-host-release
          path: ${{ runner.temp }}/sdk-host-release

      - name: Run conformance runner self-tests
        run: python -m unittest discover -s host/tests/conformance -p "test_conformance_runner.py"

      - name: Build .NET SDK and conformance adapter
        run: dotnet build sdks/dotnet/DevHub.DotNetSdk.slnx -c Release

      - name: Run conformance vectors
        shell: bash
        env:
          DEVHUB_SDK_HOST_ASSEMBLY: ${{ runner.temp }}/sdk-host-release/DevHub.Host.dll
          DEVHUB_TEST_BUILD_HOST: "0"
        run: |
          set -euo pipefail
          python host/tests/conformance/vector_runner.py 2>&1 | tee "$RUNNER_TEMP/devhub-ci-conformance.log"

      - name: Upload conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-conformance-diagnostics
          path: |
            ${{ runner.temp }}/devhub-ci-conformance.log
            temp/conformance_snapshots/**
          if-no-files-found: warn

  monitor-validation:
    needs: route
    if: needs.route.outputs.run_monitor_validation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Monitor Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: monitor-tauri-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            apps/monitor/src-tauri

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Monitor packaging verification
        run: python3 scripts/release/package_monitor.py --release-id monitor-ci --verify-only

      - name: Upload Monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-diagnostics-${{ github.run_id }}
          path: |
            artifacts/monitor/**
            apps/monitor/src-tauri/target/release/bundle/**
          if-no-files-found: warn

  integration-full-gate:
    needs:
      - route
      - build-and-test
    if: needs.route.outputs.run_integration_full_gate == 'true'
    runs-on: ubuntu-latest

    env:
      DEVHUB_DATA_DIR: /tmp/devhub-ci-data-full

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Restore
        run: dotnet restore host/DevHub.slnx

      - name: Build
        run: dotnet build host/DevHub.slnx -c Release --no-restore

      - name: Integration tests (full)
        shell: bash
        run: |
          set -Eeuo pipefail

          runner_log="$RUNNER_TEMP/devhub-ci-full-tests.log"
          host_log="$RUNNER_TEMP/devhub-ci-host-full.log"
          repo_temp_dir="$GITHUB_WORKSPACE/temp"
          text_report_path="$repo_temp_dir/test_results.txt"
          test_log_path="$repo_temp_dir/test_log.txt"
          runtime_dir="$DEVHUB_DATA_DIR/runtime"
          definitions_dir="$DEVHUB_DATA_DIR/apps/definitions"

          print_file_if_exists() {
            local label="$1"
            local path="$2"
            if [ -f "$path" ]; then
              echo "--- $label ($path) ---"
              cat "$path"
            fi
          }

          print_file_tail_if_exists() {
            local label="$1"
            local path="$2"
            local lines="${3:-200}"
            if [ -f "$path" ]; then
              echo "--- $label (last $lines lines: $path) ---"
              tail -n "$lines" "$path"
            fi
          }

          dump_diagnostics() {
            local status="${1:-1}"
            echo "::group::DevHub full integration diagnostics"
            echo "Exit code: $status"
            echo "Data dir: $DEVHUB_DATA_DIR"
            echo "Runtime dir: $runtime_dir"
            echo "App definitions dir: $definitions_dir"

            if [ -d "$DEVHUB_DATA_DIR" ]; then
              echo "--- data dir tree ---"
              find "$DEVHUB_DATA_DIR" -maxdepth 3 -mindepth 1 -print | sort
            fi

            print_file_if_exists "hub.json" "$runtime_dir/hub.json"
            print_file_tail_if_exists "test runner log" "$runner_log"
            print_file_if_exists "test text report" "$text_report_path"
            print_file_tail_if_exists "test framework log" "$test_log_path"
            print_file_tail_if_exists "host log" "$host_log"
            echo "::endgroup::"
          }

          on_error() {
            local status="$?"
            trap - ERR
            set +e
            dump_diagnostics "$status"
            exit "$status"
          }

          trap on_error ERR

          rm -rf "$DEVHUB_DATA_DIR"
          mkdir -p "$definitions_dir"
          rm -rf "$repo_temp_dir"
          mkdir -p "$repo_temp_dir"

          dotnet run --project host/src/DevHub.Host/DevHub.Host.csproj -c Release --no-build --no-launch-profile >"$host_log" 2>&1 &
          HOST_PID=$!

          cleanup() {
            kill "$HOST_PID" >/dev/null 2>&1 || true
            wait "$HOST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if [ -f "$runtime_dir/hub.json" ]; then
              break
            fi
            sleep 1
          done

          if [ ! -f "$runtime_dir/hub.json" ]; then
            echo "hub.json not generated by host"
            false
          fi

          python3 host/tests/blackbox/test_runner.py --full --no-header --use-existing-host --no-build-host 2>&1 | tee "$runner_log"

      - name: Upload integration-full diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-full-diagnostics
          path: |
            ${{ runner.temp }}/devhub-ci-full-tests.log
            ${{ runner.temp }}/devhub-ci-host-full.log
            temp/test_results.txt
            temp/test_results.json
            temp/test_log.txt
          if-no-files-found: warn

  cross-platform-smoke:
    needs: route
    if: needs.route.outputs.run_cross_platform_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Install Windows ACL dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywin32

      - name: Restore
        run: dotnet restore host/DevHub.slnx

      - name: Build
        run: dotnet build host/DevHub.slnx -c Release --no-restore

      - name: Integration tests (smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dataDir = Join-Path $env:RUNNER_TEMP "devhub-smoke-data"
          $runtimeDir = Join-Path $dataDir "runtime"
          $appDefsDir = Join-Path (Join-Path $dataDir "apps") "definitions"
          $hubJsonPath = Join-Path $runtimeDir "hub.json"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "devhub-smoke-host.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "devhub-smoke-host.stderr.log"
          $runnerLog = Join-Path $env:RUNNER_TEMP "devhub-smoke-test-runner.log"
          $repoTempDir = Join-Path (Get-Location) "temp"
          $textReportPath = Join-Path $repoTempDir "test_results.txt"
          $jsonReportPath = Join-Path $repoTempDir "test_results.json"
          $testLogPath = Join-Path $repoTempDir "test_log.txt"
          $diagnosticsPrinted = $false

          function Show-FileIfExists([string]$Label, [string]$Path) {
            if (Test-Path $Path) {
              Write-Host "--- $Label ($Path) ---"
              Get-Content $Path
            }
          }

          function Show-FileTailIfExists([string]$Label, [string]$Path, [int]$Lines = 200) {
            if (Test-Path $Path) {
              Write-Host "--- $Label (last $Lines lines: $Path) ---"
              Get-Content $Path | Select-Object -Last $Lines
            }
          }

          function Show-Diagnostics([int]$ExitCode) {
            if ($diagnosticsPrinted) {
              return
            }

            $script:diagnosticsPrinted = $true
            Write-Host "::group::DevHub smoke diagnostics"
            Write-Host "Exit code: $ExitCode"
            Write-Host "Data dir: $dataDir"
            Write-Host "Runtime dir: $runtimeDir"
            Write-Host "App definitions dir: $appDefsDir"

            if (Test-Path $dataDir) {
              Write-Host "--- data dir tree ---"
              Get-ChildItem -Path $dataDir -Recurse -Force |
                Select-Object FullName, Length, LastWriteTimeUtc |
                Format-Table -AutoSize
            }

            Show-FileIfExists "hub.json" $hubJsonPath
            Show-FileTailIfExists "test runner log" $runnerLog
            Show-FileIfExists "test text report" $textReportPath
            Show-FileTailIfExists "test framework log" $testLogPath
            Show-FileTailIfExists "host stdout log" $stdoutLog
            Show-FileTailIfExists "host stderr log" $stderrLog
            Write-Host "::endgroup::"
          }

          if (Test-Path $dataDir) { Remove-Item -Path $dataDir -Recurse -Force }
          if (Test-Path $repoTempDir) { Remove-Item -Path $repoTempDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $appDefsDir | Out-Null
          New-Item -ItemType Directory -Force -Path $repoTempDir | Out-Null

          $env:DEVHUB_DATA_DIR = $dataDir

          $hostArgs = @(
            "run",
            "--project", "host/src/DevHub.Host/DevHub.Host.csproj",
            "-c", "Release",
            "--no-build",
            "--no-launch-profile"
          )

          $hostProcess = Start-Process -FilePath "dotnet" -ArgumentList $hostArgs -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru

          try {
            for ($i = 0; $i -lt 40; $i++) {
              if (Test-Path $hubJsonPath) {
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not (Test-Path $hubJsonPath)) {
              Write-Host "hub.json not generated by host"
              Show-Diagnostics 1
              throw "Host bootstrap failed in smoke job."
            }

            python host/tests/blackbox/test_runner.py --smoke --no-header --use-existing-host --no-build-host 2>&1 | Tee-Object -FilePath $runnerLog
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -ne 0) {
              Show-Diagnostics $testExitCode
              throw "Smoke tests failed."
            }
          }
          finally {
            if ($null -ne $hostProcess -and -not $hostProcess.HasExited) {
              Stop-Process -Id $hostProcess.Id -Force
            }

            if (-not $diagnosticsPrinted -and (Test-Path $stdoutLog)) {
              Get-Content $stdoutLog | Select-Object -Last 80
            }
            if (-not $diagnosticsPrinted -and (Test-Path $stderrLog)) {
              Get-Content $stderrLog | Select-Object -Last 80
            }
          }

      - name: Upload cross-platform smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-platform-smoke-${{ matrix.os }}-diagnostics
          path: |
            ${{ runner.temp }}/devhub-smoke-*.log
            temp/test_results.txt
            temp/test_results.json
            temp/test_log.txt
          if-no-files-found: warn

  prepare-release-core-assets:
    needs:
      - route
      - build-and-test
      - sdk-dotnet-tests
      - sdk-ts-tests
      - sdk-python-tests
      - sdk-conformance
      - integration-full-gate
      - cross-platform-smoke
    if: needs.route.outputs.prepare_release_core_assets == 'true'
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare core release assets
        run: |
          python3 scripts/release/package_release.py \
            --release-id "${{ needs.route.outputs.release_id }}" \
            --channel "${{ needs.route.outputs.release_channel }}" \
            --release-tag "${{ needs.route.outputs.release_tag }}" \
            --release-name "${{ needs.route.outputs.release_name }}" \
            --commit "${{ github.sha }}" \
            --skip-monitor \
            --validated-externally

      - name: Upload core release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-core-${{ needs.route.outputs.release_id }}
          path: artifacts/release/${{ needs.route.outputs.release_id }}
          if-no-files-found: error

      - name: Upload core release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-core-diagnostics-${{ github.run_id }}
          path: artifacts/release/**
          if-no-files-found: warn

  prepare-monitor-release-assets:
    needs:
      - route
    if: needs.route.outputs.prepare_monitor_release_assets == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Monitor Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: monitor-tauri-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            apps/monitor/src-tauri

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Monitor App assets
        run: python3 scripts/release/package_monitor.py --release-id "${{ needs.route.outputs.release_id }}" --output-root artifacts/monitor --validated-externally

      - name: Upload Monitor App assets
        uses: actions/upload-artifact@v7
        with:
          name: monitor-assets-${{ matrix.runner }}-${{ needs.route.outputs.release_id }}
          path: artifacts/monitor/${{ needs.route.outputs.release_id }}
          if-no-files-found: error

      - name: Upload Monitor diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            artifacts/monitor/**
            apps/monitor/src-tauri/target/release/bundle/**
          if-no-files-found: warn

  publish-release:
    if: >
      always() &&
      needs.route.outputs.is_release_intent == 'true' &&
      needs.prepare-release-core-assets.result == 'success' &&
      (needs.route.outputs.release_channel == 'stable' ||
       (needs.monitor-validation.result == 'success' &&
        needs.prepare-monitor-release-assets.result == 'success'))
    needs:
      - route
      - monitor-validation
      - prepare-release-core-assets
      - prepare-monitor-release-assets
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-reusable.yml
    with:
      target_ref: ${{ github.sha }}
      release_ref: ${{ github.ref }}
      verify_ci_success: false
      ci_run_id: ${{ github.run_id }}
    secrets: inherit
