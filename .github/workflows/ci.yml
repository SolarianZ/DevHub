name: ci

on:
  push:
    branches:
      - main
      - m4
      - "codex/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DEVHUB_RUNTIME_DIR: /tmp/devhub-ci-runtime
      DEVHUB_APPDEFS_DIR: /tmp/devhub-ci-appdefs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Restore
        run: dotnet restore src/DevHub.slnx

      - name: Build
        run: dotnet build src/DevHub.slnx -c Release --no-restore

      - name: Clean test result artifacts
        run: find src -type d -name TestResults -prune -exec rm -rf {} +

      - name: Unit tests with coverage
        run: dotnet test src/DevHub.slnx -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --verbosity normal

      - name: Verify coverage thresholds (line>=90%, branch>=80%)
        run: python3 tests/verify_coverage.py --root . --line-threshold 0.90 --branch-threshold 0.80

      - name: Integration tests (fast)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEVHUB_RUNTIME_DIR" "$DEVHUB_APPDEFS_DIR"
          mkdir -p "$DEVHUB_RUNTIME_DIR" "$DEVHUB_APPDEFS_DIR"

          dotnet run --project src/DevHub.Host/DevHub.Host.csproj -c Release --no-build --no-launch-profile >/tmp/devhub-ci-host.log 2>&1 &
          HOST_PID=$!

          cleanup() {
            kill "$HOST_PID" >/dev/null 2>&1 || true
            wait "$HOST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if [ -f "$DEVHUB_RUNTIME_DIR/hub.json" ]; then
              break
            fi
            sleep 1
          done

          if [ ! -f "$DEVHUB_RUNTIME_DIR/hub.json" ]; then
            echo "hub.json not generated by host"
            cat /tmp/devhub-ci-host.log
            exit 1
          fi

          python3 tests/test_runner.py --fast --no-header

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Install Windows ACL dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywin32

      - name: Restore
        run: dotnet restore src/DevHub.slnx

      - name: Build
        run: dotnet build src/DevHub.slnx -c Release --no-restore

      - name: Integration tests (smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeDir = Join-Path $env:RUNNER_TEMP "devhub-smoke-runtime"
          $appDefsDir = Join-Path $env:RUNNER_TEMP "devhub-smoke-appdefs"
          $hubJsonPath = Join-Path $runtimeDir "hub.json"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "devhub-smoke-host.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "devhub-smoke-host.stderr.log"

          if (Test-Path $runtimeDir) { Remove-Item -Path $runtimeDir -Recurse -Force }
          if (Test-Path $appDefsDir) { Remove-Item -Path $appDefsDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $appDefsDir | Out-Null

          $env:DEVHUB_RUNTIME_DIR = $runtimeDir
          $env:DEVHUB_APPDEFS_DIR = $appDefsDir

          $hostArgs = @(
            "run",
            "--project", "src/DevHub.Host/DevHub.Host.csproj",
            "-c", "Release",
            "--no-build",
            "--no-launch-profile"
          )

          $hostProcess = Start-Process -FilePath "dotnet" -ArgumentList $hostArgs -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru

          try {
            for ($i = 0; $i -lt 40; $i++) {
              if (Test-Path $hubJsonPath) {
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not (Test-Path $hubJsonPath)) {
              Write-Host "hub.json not generated by host"
              if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
              if (Test-Path $stderrLog) { Get-Content $stderrLog }
              throw "Host bootstrap failed in smoke job."
            }

            python tests/test_runner.py --smoke --no-header
            if ($LASTEXITCODE -ne 0) {
              throw "Smoke tests failed."
            }
          }
          finally {
            if ($null -ne $hostProcess -and -not $hostProcess.HasExited) {
              Stop-Process -Id $hostProcess.Id -Force
            }

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog | Select-Object -Last 80
            }
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog | Select-Object -Last 80
            }
          }
